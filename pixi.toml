[workspace]
authors = [
    "Prince Ravi Leow <prince.ravi.leow@sund.ku.dk>",
    "Neclow <neil.clow@sund.ku.dk>",
    "David Duchêne <david.duchene@sund.ku.dk>",
]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
name = "PlayClass"
version = "0.1.0"

[feature.cuda.system-requirements]
cuda = "12.6"

# ======= Environments ======
[environments]
tracker = ["tracker", "cuda"]
dataset = ["dataset", "cuda"]
embeddings = ["embeddings", "cuda"]
classifier = ["classifier", "cuda"]
videoprism = ["videoprism"]
tracker-evaluation = ["tracker-evaluation"]
gs2 = ["gs2", "cuda"]

# ======= Default dependencies ======
[dependencies]
python = ">=3.11,<3.12"
ffmpeg = "==8.0.1"
pkg-config = "*"
ruff = ">=0.15.1,<0.16"
pytest = ">=9.0.2,<10"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
pandas = ">=3.0.0,<4"
loguru = ">=0.7.3"
tqdm = ">=4.67.1,<5"
pyarrow = ">=23.0.0,<24"
ipykernel = ">=7.1.0"
ipywidgets = ">=8.1.8"
matplotlib = ">=3.7.0,<4"
seaborn = ">=0.13.2"
nbconvert = ">=7.16.6,<8"

[feature.cuda.target.linux-64.pypi-dependencies]
torch = "==2.9.1+cu126"
torchvision = "==0.24.1+cu126"

# ======= Tracker dependencies ======
[feature.tracker.pypi-dependencies]
transformers = { git = "https://github.com/huggingface/transformers", rev = "v5.0.0rc2" }
accelerate = ">=1.12.0"
ftfy = "==6.1.1"
omegaconf = ">=2.3.0"
ultralytics = "*"
numpy = ">=1.2.6,<2"
opencv-python = "*"
pillow = ">=12.1.0,<13"
pycocotools = ">=2.0.11,<3"
torchcodec = "==0.9"
supervision = ">=0.27.0,<0.28"
simpler-timer = ">=0.0.2"

[feature.tracker.tasks]
tracker = "python -m script.run_tracker --config config/tracker.yaml"
tracker_scan = "python -m script.run_tracker --config config/tracker_scan.yaml"
test_tracker = "CUDA_VISIBLE_DEVICES=1 pixi run -e tracker python -m pytest tests/test_tracker.py -v"
# Pre-CVAT tracker_eval stages: select-frames imports src.metrics / src.tracker.*
# transitively, which requires torch — so these live in the tracker env, not
# tracker-evaluation. Post-CVAT stages (score, convert-preds, evaluate) are
# torch-free and live under [feature.tracker-evaluation.tasks].
prepare-tracker-eval = "python -m src.tracker_eval prepare"
select_annotation_frames = "python -m src.tracker_eval select-frames"

# ======= Dataset dependencies ======
[feature.dataset.pypi-dependencies]
numpy = ">=1.2.6,<2"
opencv-python = "*"
pycocotools = ">=2.0.11,<3"
openpyxl = ">=3.1.0,<4"

[feature.dataset.tasks]
build_dataset = "python -m script.build_dataset"
extract_features = "python -m script.extract_features"
test_labels = "python -m pytest tests/test_labels.py -v"
test_features = "python -m pytest tests/test_features.py -v"
test_postprocessing = "python -m pytest tests/test_tracking_postprocessing.py -v"
test_post_build = "python -m pytest tests/test_post_build_dataset.py -v"
test_postprocessing_smoke = "python -m tests.test_postprocessing_smoke"

# ======= Tracker evaluation dependencies ======
[feature.tracker-evaluation.pypi-dependencies]
numpy = ">=1.2.6,<2"
motmetrics = ">=1.4.0"
omegaconf = ">=2.3.0"
pycocotools = ">=2.0.11,<3"
opencv-python = "*"
scikit-image = "*"
pillow = ">=10.0.0"
tabulate = "*"

[feature.tracker-evaluation.tasks]
# Post-CVAT tracker_eval stages: torch-free (motmetrics + vendored TrackEval).
# Pre-CVAT stages (prepare, select-frames) live in [feature.tracker.tasks].
score-tracker-eval = "python -m src.tracker_eval score"
convert_predictions = "python -m src.tracker_eval convert-preds"
evaluate_tracker = "python -m src.tracker_eval evaluate"

# ======= Embeddings dependencies ======
[feature.embeddings.pypi-dependencies]
transformers = { git = "https://github.com/huggingface/transformers", rev = "v5.0.0rc2" }
accelerate = ">=1.12.0"
peft = ">=0.15"
numpy = ">=1.2.6,<2"
opencv-python = "*"
timm = "*"
einops = "*"
pillow = ">=12.1.0,<13"
pycocotools = ">=2.0.11,<3"
torchcodec = "==0.9"
scikit-learn = ">=1.7.0"

[feature.embeddings.tasks]
extract_embeddings = "python -m script.extract_embeddings_dinov3"
extract_embeddings_dinov3 = "python -m script.extract_embeddings_dinov3"
extract_embeddings_vjepa2 = "python -m script.extract_embeddings_vjepa2"
test_crops = "python -m tests.test_crop_smoke --video-dir data/video/batch"

# ======= Classifier dependencies ======
[feature.classifier.pypi-dependencies]
lightning = ">=2.5"
wandb = ">=0.19"
torchmetrics = ">=1.7"
xgboost = ">=3.2.0, <4"
shap = ">=0.51.0, <0.52"
scikit-learn = ">=1.7.0"

[feature.classifier.tasks]
train = "python -m script.train"
train_xgboost = "python -m script.train_xgboost"
train_pooler = "python -m script.train_pooler"
test_pooling = "python -m pytest tests/test_pooling.py -v"
test_val_rotation = "python -m pytest tests/test_val_rotation.py -v"

# ======= VideoPrism dependencies ======
[feature.videoprism.system-requirements]
cuda = "12"

[feature.videoprism.target.linux-64.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }
opt-einsum = ">=3.3,<3.4"
videoprism = { git = "https://github.com/google-deepmind/videoprism" }
einshape = ">=1.0"
mediapy = ">=1.2.0"
pillow = ">=12.1.0,<13"
opencv-python-headless = ">=4.10"

[feature.videoprism.tasks]
extract_videoprism = "python -m script.extract_embeddings_videoprism"

# ======= Grounded-SAM-2 (gs2) dependencies ======
[feature.gs2]
platforms = ["linux-64"]

[feature.gs2.pypi-dependencies]
setuptools = "*"
transformers = { git = "https://github.com/huggingface/transformers", rev = "v5.0.0rc2" }
opencv-python = ">=4.13.0.90,<5"
pycocotools = ">=2.0.11,<3"
pillow = ">=12.1.0,<13"
numpy = ">=2.4.1,<3"
pandas = ">=3.0.0,<4"
supervision = ">=0.27.0,<0.28"
tqdm = ">=4.67.1,<5"
pyarrow = ">=23.0.0,<24"
loguru = ">=0.7.3"
omegaconf = ">=2.3.0"
psutil = ">=5.9.0"

[feature.gs2.tasks]
download-sam2-checkpoints = { cmd = """
bash -c 'if ls checkpoints/*.pt 1> /dev/null 2>&1; then echo "SAM2 checkpoints already exist, skipping download..."; else cd checkpoints && bash download_ckpts.sh; fi'
""", cwd = "ext/Grounded-SAM-2" }

download-gdino-checkpoints = { cmd = """
bash -c 'if ls gdino_checkpoints/*.pth 1> /dev/null 2>&1; then echo "Grounding DINO checkpoints already exist, skipping download..."; else cd gdino_checkpoints && bash download_ckpts.sh; fi'
""", cwd = "ext/Grounded-SAM-2" }

install-pytorch = "uv pip install torch torchvision torchaudio"

install-gs2-packages = { cmd = """
export CUDA_HOME="/usr/lib/nvidia-cuda-toolkit/" && \
uv pip install -e . && \
uv pip install --no-build-isolation -e grounding_dino
""", cwd = "ext/Grounded-SAM-2" }

setup-gs2 = { depends-on = [
    "download-sam2-checkpoints",
    "download-gdino-checkpoints",
    "install-pytorch",
    "install-gs2-packages",
] }

gs2_tracker = "python -m src.tracker_eval.run_gs2_tracker --config data/tracker_eval/config/gs2_fixed_day_28.yaml"
