# Manual chunking mode
# Processes 30s (750 frames @ ~25fps) of one video with explicit chunk boundaries.
# Run: pixi run -e sam3-hf python -m script.sam3.run_sam3_hf --config config/manual_chunking.yaml

job_type: "sam3_hf"

CUDA_VISIBLE_DEVICES: "1"
PYTORCH_ALLOC_CONF: "expandable_segments:True,garbage_collection_threshold:0.6"

video_path: "video-data/C1G1_Test_1_day_28_1_Camera_4_2025_02_04_10_59_56_1.mp4"
text_prompt: "bird"
output_dir: "ext-data/output/results/test"

max_frames_to_track: 750  # 30s @ ~25fps

video_model_chunk_seconds: 15
tracker_chunk_seconds: 45

prescan_only: false
use_adaptive_chunking: false
run_parameter_sensitivity: false

# Explicit chunk boundaries (overrides fixed/adaptive chunking)
# Chunk 0: frames 0-375 (~15s) — text-prompt model
# Chunk 1: frames 375-750 (~15s) — point-prompt tracker model
manual_chunk_frames:
  - [0, 375]
  - [375, 750]

min_objects_for_tracking: 3
max_lookback_frames: 10
point_extraction_method: "equidistant"
