# SAM3 HuggingFace Tracking Pipeline Default Configuration
# Override values via command line or by creating a separate config file.

# =============================================================================
# Job Configuration
# =============================================================================
job_type: "sam3_hf" # Type of job to run

# =============================================================================
# Environmental variables
# =============================================================================
CUDA_VISIBLE_DEVICES: "1" # Specify which GPU to use
PYTORCH_ALLOC_CONF: "expandable_segments:True,garbage_collection_threshold:0.6" # Prevent OOM errors

# =============================================================================
# Video/IO Configuration
# =============================================================================
# Video input — specify exactly one:
# video_path: null
video_dir: "video-data/batch" # Uncomment to batch-process all videos in directory (mutually exclusive with video_path)
text_prompt: "bird"

# Output directory - results will be saved to a timestamped subdirectory
# Format: {output_dir}/{YYYYMMDD_HHMMSS}_{job_type}/
output_dir: "ext-data/output/results/sam3-hf"

# =============================================================================
# Model Configuration
# =============================================================================
start_frame: 0 # Frame index to start processing from (0 = beginning)
max_frames_to_track: 0 # Maximum number of frames to propagate (0 = all)

# =============================================================================
# Chunking Configuration
# =============================================================================
# YOLO-scan-only mode: run YOLO scan and exit without loading SAM3 models
yolo_scan_only: false

# Occlusion-aware adaptive chunking (YOLO-based scan)
use_adaptive_chunking: true # Enable adaptive boundary placement via YOLO scan
# Chunk sizes
chunk_seconds: 60 # Base duration of each chunk in seconds
# Chunk length limits
adaptive_max_chunk_seconds: 120 # Hard VRAM cap — never exceed this
adaptive_search_window_seconds: 10.0 # Search radius (±s) when refining each boundary

# =============================================================================
# YOLO scan configuration
# These parameters drive compute_yolo_per_frame_metrics(), which computes a
# separation_score per frame.  chunk_video_frames_adaptive() then picks the
# highest-scoring frame in a ±adaptive_search_window_seconds window around
# each nominal chunk boundary.
#
# A frame scores > 0 only when ALL three hard gates pass:
#   1. num_objects >= separation_min_objects
#   2. max_pairwise_bbox_iou < occlusion_iou_threshold   (no overlapping pairs)
#   3. min_centroid_distance >= separation_min_distance
# The actual score is: min(min_centroid_distance, 1) * (1 - clustering_coeff)
#
# To retune without re-running YOLO inference:
#   1. Edit the params below
#   2. pixi run -e sam3-hf python -m script.compute_chunk_boundaries \
#          --run-dir <run_dir> --config config/yolo_scan_only.yaml
# =============================================================================
# YOLO-based scan configuration (used when use_adaptive_chunking: true)
yolo_scan:
  # --- YOLO inference ---
  model: "model/yolo26x.pt"
  conf_thresh: 0.25
  iou_thresh: 0.45
  tracker_config: "data/yolo/botsort_alternative.yaml"
  allowed_classes: ["bird"]

  # --- Separation scoring ---
  # Gate 1: minimum number of birds that must be detected for a frame to qualify.
  separation_min_objects: 3

  # Gate 2: hard IoU disqualifier — any bbox pair with IoU >= this value
  # means the frame is considered too occluded to use as a chunk boundary.
  # Keep this low (0.05–0.10); even slight overlap is a bad sign.
  occlusion_iou_threshold: 0.07

  # Gate 3: minimum normalised centroid distance between any two birds.
  # 0.10 ≈ 10% of frame width — a reasonable minimum for unambiguous tracking.
  separation_min_distance: 0.10

  # Clustering coefficient threshold baked into the score formula
  # (fraction of pairs within this distance counts against the score).
  clustering_distance_threshold: 0.15

# =============================================================================
# Multi-object Tracking Heuristics
# =============================================================================
min_objects_for_tracking: 3 # Minimum objects to look for in previous chunk
max_lookback_frames: 10 # Max frames to look back

# =============================================================================
# Text Grounding
# Run Sam3VideoModel on first N frames of each tracker chunk for fresh
# text-grounded detections, replacing drifted point prompts from prev chunk.
# Cost: ~same as Chunk 0 per tracker chunk. Keep grounding_frames small.
# =============================================================================
text_grounding:
  enabled: false # Off by default
  grounding_frames: 25 # Frames to ground (~1 s at 25 fps)
  min_objects: 3 # Min detections to accept grounding result
  best_frame_method: "combined" # "combined" | "min_occlusion" | "best_scores"
  fallback_to_prev_chunk: true # Fall back to prev-chunk points if grounding fails
  id_matching: true # Remap fresh IDs to previous chunk IDs
  id_match_iou_threshold: 0.10 # Min mask IoU to accept an ID assignment

# =============================================================================
# Sam3VideoConfig Tracking Parameters
# These help prevent identity loss and duplicate assignments
# =============================================================================
tracking:
  init_trk_keep_alive: 60 # Keep tracks alive longer (default: 30)
  max_trk_keep_alive: 60 # Higher ceiling for keep-alive (default: 30)
  min_trk_keep_alive: 0 # Don't go negative as quickly (default: -1)
  trk_assoc_iou_thresh: 0.3 # More lenient matching (default: 0.5)
  hotstart_dup_thresh: 12 # Stricter duplicate detection (default: 8)
  suppress_overlap_thresh: 0.8 # Stricter overlap suppression (default: 0.7)
  recondition_every_nth_frame: 8 # More frequent reconditioning (default: 16)

# =============================================================================
# Metrics Configuration
# =============================================================================
metrics:
  occlusion_iou_threshold: 0.15 # IoU above this = objects overlapping
  clustering_distance_threshold: 50.0 # pixels - objects closer than this are "clustered"
