# BoT-SORT optimized for top-down chicken tracking
# Use case:
#   - Fast movement with motion blur
#   - High occlusion (bunching behavior)
#   - Stationary camera (570x570 resolution)
#   - YOLO26x detector
# Docs: https://docs.ultralytics.com/modes/track/

tracker_type: botsort

# Matching thresholds - adjusted for motion blur and fast movement
track_high_thresh: 0.2       # ↓ Lowered from 0.25 to handle motion blur detections
track_low_thresh: 0.08       # ↓ Slightly lower for better recovery during blur
new_track_thresh: 0.32       # ↑ Raised from 0.25 to reduce false IDs during occlusion
track_buffer: 55             # ↑ Increased from 30 for extended occlusions when bunching
match_thresh: 0.65           # ↓ Lowered from 0.8 for fast movement (larger displacement)
fuse_score: True             # Keep enabled for stability with fluctuating scores

# BoT-SORT specifics
gmc_method: none             # Changed from sparseOptFlow - no GMC needed for stationary camera

# ReID model related thresh
proximity_thresh: 0.35       # ↓ Lowered from 0.5 for fast-moving objects
appearance_thresh: 0.8       # Keep default (ReID disabled)
with_reid: False             # Test True if ID switches become problematic
model: auto
