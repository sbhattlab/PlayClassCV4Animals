# SAM3 HuggingFace Video Chunking Test Configuration
# Shorter chunks and more frequent visualization for faster iteration.

# =============================================================================
# Video/IO Configuration
# =============================================================================
video_path: "/mnt/birds/rebecca2025/test/video_1_1min.mp4"
text_prompt: "bird"

# Output paths
output_path: "data/results/sam3-hf-test/results.json"
vis_output_dir: "sandbox/test/sam3-hf-chunking-test/"
log_output_dir: "sandbox/logs/sam3-hf-chunking-test/"

# =============================================================================
# Chunking Configuration (Shorter for testing)
# =============================================================================
chunk_duration_seconds: 34 # Shorter chunks for testing
vis_frame_stride: 5 # More frequent visualization for testing

# =============================================================================
# Multi-object Tracking Heuristics (Shorter lookback for testing)
# =============================================================================
min_objects_for_tracking: 3 # Minimum objects to look for in previous chunk
max_lookback_frames: 5 # Shorter for testing

# =============================================================================
# Sam3VideoConfig Tracking Parameters
# These help prevent identity loss and duplicate assignments
# =============================================================================
tracking:
  init_trk_keep_alive: 60 # Keep tracks alive longer (default: 30)
  max_trk_keep_alive: 60 # Higher ceiling for keep-alive (default: 30)
  min_trk_keep_alive: 0 # Don't go negative as quickly (default: -1)
  trk_assoc_iou_thresh: 0.3 # More lenient matching (default: 0.5)
  hotstart_dup_thresh: 12 # Stricter duplicate detection (default: 8)
  suppress_overlap_thresh: 0.8 # Stricter overlap suppression (default: 0.7)
  recondition_every_nth_frame: 8 # More frequent reconditioning (default: 16)
