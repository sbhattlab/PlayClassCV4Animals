# SAM3 HuggingFace Tracking Pipeline

# =============================================================================
# ENVIRONMENT
# =============================================================================
CUDA_VISIBLE_DEVICES: "1"
PYTORCH_ALLOC_CONF: "expandable_segments:True,garbage_collection_threshold:0.6"

# =============================================================================
# INPUT / OUTPUT
# =============================================================================
job_type: "sam3_hf"
# video_path: null # Path to single video file
video_dir: "video-data/batch" # Batch-process all videos in directory (mutually exclusive with video_path)
text_prompt: "bird"
output_dir: "ext-data/output/results/sam3-hf"
start_frame: 0
max_frames_to_track: 0

# =============================================================================
# CHUNKING MODE  — only ONE of these should be active at a time
#
#   Priority order (highest wins):
#     1. reuse_chunk_info    → load boundaries from a previous run
#     2. manual_chunk_frames → explicit frame pairs (see sam3_hf_manual_chunking.yaml)
#     3. use_adaptive_chunking: true   → YOLO scan to find boundaries
#     4. use_adaptive_chunking: false  → fixed chunk_seconds
# =============================================================================

# --- Mode 1: Reuse a previous run's chunk boundaries ---
reuse_chunk_info: false
reuse_run_dir: null # e.g. "ext-data/output/results/sam3-hf/20260306_152733_sam3_hf"

# --- Mode 3/4: Adaptive or fixed chunking (active when reuse_chunk_info: false) ---
yolo_scan_only: false
use_adaptive_chunking: true
chunk_seconds: 60
adaptive_max_chunk_seconds: 120
adaptive_search_window_seconds: 10.0

# =============================================================================
# YOLO SCAN  (used only when use_adaptive_chunking: true)
# =============================================================================
yolo_scan:
  model: "model/yolo26x.pt"
  conf_thresh: 0.25
  iou_thresh: 0.45
  tracker_config: "config/botsort.yaml"
  allowed_classes: ["bird"]
  separation_min_objects: 3
  occlusion_iou_threshold: 0.07
  separation_min_distance: 0.10
  clustering_distance_threshold: 0.15

# =============================================================================
# TRACKING HEURISTICS
# =============================================================================
min_objects_for_tracking: 3
max_lookback_frames: 10

# =============================================================================
# TEXT GROUNDING
# =============================================================================
text_grounding:
  enabled: true
  grounding_frames: 125
  min_objects: 3
  best_frame_method: "combined"
  fallback_to_prev_chunk: true
  id_matching: true
  id_match_iou_threshold: 0.10

# =============================================================================
# SAM3 TRACKER PARAMETERS
# =============================================================================
tracking:
  init_trk_keep_alive: 60
  max_trk_keep_alive: 60
  min_trk_keep_alive: 0
  trk_assoc_iou_thresh: 0.3
  hotstart_dup_thresh: 12
  suppress_overlap_thresh: 0.8
  recondition_every_nth_frame: 8

# =============================================================================
# METRICS
# =============================================================================
metrics:
  occlusion_iou_threshold: 0.15
  clustering_distance_threshold: 50.0
