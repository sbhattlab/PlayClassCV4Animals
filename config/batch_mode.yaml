# Batch processing mode with per-video manual chunk boundaries
# Processes all .mp4 files in video_dir, each into its own subdirectory.
# Run: pixi run -e sam3-hf python -m script.sam3.run_sam3_hf --config config/batch_mode.yaml

job_type: "sam3_hf"

CUDA_VISIBLE_DEVICES: "1"
PYTORCH_ALLOC_CONF: "expandable_segments:True,garbage_collection_threshold:0.6"

video_dir: "ext-data/test/batch_mode_test_set"
text_prompt: "bird"
output_dir: "ext-data/output/results/test"

max_frames_to_track: 750  # 30s @ ~25fps — keeps each video run short

video_model_chunk_seconds: 15
tracker_chunk_seconds: 45

prescan_only: false
use_adaptive_chunking: false
run_parameter_sensitivity: false

# Per-video manual chunk boundaries, keyed by basename.
# Videos not listed fall back to fixed chunking (video_model_chunk_seconds / tracker_chunk_seconds).
manual_chunk_frames:
  "test_video_1.mp4":
    - [0, 375]
    - [375, 750]
  "test_video_2.mp4":
    - [0, 500]
    - [500, 750]
  "test_video_3.mp4":
    - [0, 375]
    - [375, 750]

min_objects_for_tracking: 3
max_lookback_frames: 10
point_extraction_method: "equidistant"
